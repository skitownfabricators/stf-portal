
<title>STF Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --bad: #ef8a8a; --bad-soft: #3d1c1c; --alt: #c39bf0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1a1f25; --sheet: #f4f5f3; --ink: #e5e8eb; --muted: #9aa3ad; --line: #2f3740;
  --accent: #86a2ff; --accent-soft: #1f2a4a; --ok: #6cc596; --ok-soft: #173326; --warn: #e3a94f; --warn-soft: #3a2c14;
  --bad: #ef8a8a; --bad-soft: #3d1c1c; --alt: #c39bf0; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0 }

.tablewrap { overflow-x: auto }

.opt:focus-visible, .figtabs button:focus-visible, .navbtn:focus-visible, .chip:focus-visible, .save:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
textarea { width: 100%; min-height: 64px; font: 15px/1.4 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; resize: vertical }

@media (max-width: 900px) { .cover { grid-template-columns: 1fr } }

.zoombox { position: fixed; inset: 0; z-index: 50; background: #0c0e11; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px) }
.zoombar { background: #15181c; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; color: #fff; flex-wrap: wrap }

.zoomcanvas .marker { width: 30px; height: 30px }
.cmt { border-left: 4px solid var(--accent) }
.cmtlist { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px }
.cmtlist li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; background: var(--bg); border-radius: 4px; padding: 8px 10px; font-size: 14.5px }
.cmtlist .where { font: 600 11px/1.4 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: block }
.cmtlist button { font: 600 12px/1 var(--body); border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 4px; padding: 5px 7px; cursor: pointer }
.marker.warn { background: var(--bad) }

.zring.warn { border-color: var(--bad) } .ztag.warn { background: var(--bad) }

.scalebar.est { background: var(--warn-soft); color: var(--warn) } .scalebar.ok { background: var(--ok-soft); color: var(--ok) }

.mline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }

.pread input[type="text"] { flex: 1 1 200px; font: 14px var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink) }
.place { display: flex; flex-direction: column; gap: 12px }
.pstage { position: relative; line-height: 0; background: var(--sheet); border-radius: 4px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none }
.pstage > img { width: 100%; height: auto; display: block }

.pobj img { width: 100%; height: 100%; display: block; object-fit: fill; pointer-events: none }

.preads { display: flex; flex-direction: column; gap: 10px }

.pstage { overscroll-behavior: contain }

.cmtrow { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center }
.ro { font-size: 14px; color: var(--warn); background: var(--warn-soft); border-radius: var(--r); padding: 10px 12px; margin: 0 }
.sumlist { margin: 0 0 16px; padding-left: 24px; display: flex; flex-direction: column; gap: 8px; font: 600 clamp(18px, 2vw, 21px)/1.3 var(--display) }
.shotwrap { position: relative; padding: 0 48px; line-height: 0 }

.marker.alt { background: var(--alt) }

.marker .ico svg { width: 11px; height: 11px; stroke: var(--alt) }
.notes li.alt .n { background: var(--alt) }
.notes li.is-on .n { background: var(--warn) }

.opttag svg { width: 13px; height: 13px; stroke: var(--alt) }
.zoombox { flex-direction: row }
.zoommain { flex: 1; display: flex; flex-direction: column; min-width: 0 }

.ztag { position: absolute; left: 0; top: 0; font: 700 13px/20px var(--mono); min-width: 22px; padding: 0 6px; text-align: center; border-radius: 10px; background: var(--accent); color: #fff; transform-origin: 0 0; pointer-events: none; box-shadow: 0 1px 3px rgba(0,0,0,.4) }

.owner { display: flex; flex-direction: column; gap: 6px }

.ownerrow button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.ownerhint { margin: 0; font-size: 13.5px; color: var(--muted) }
.otag { font: 600 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; white-space: nowrap; margin-left: 8px; vertical-align: middle }
